name: Native ownership

on:
  push:
    paths:
      - '4D Plugin API/**'
      - '4DPlugin.cpp'
      - '4DPlugin.h'
      - '.github/tests/ownership_host.mm'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'
  pull_request:
    paths:
      - '4D Plugin API/**'
      - '4DPlugin.cpp'
      - '4DPlugin.h'
      - '.github/tests/ownership_host.mm'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'

permissions:
  contents: read

jobs:
  ownership:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic native ownership, ASan and UBSan
        env:
          OWNERSHIP_TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/tests/test_ownership.py -v
